<style>
.pb-preloader{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;background:#f7f2e9;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility .35s}
.pb-loading .pb-preloader{opacity:1;visibility:visible}
.pb-preloader img{width:88px;height:70px;object-fit:contain}
.pb-preloader span{width:28px;height:28px;border:2px solid #06578126;border-top-color:#065781;border-radius:50%;animation:pb-loading-spin 1.1s linear infinite}
@keyframes pb-loading-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pb-preloader{transition:none}.pb-preloader span{animation:none;border-top-color:#e1ab33}}
</style>
<script>
(function(){
  var finished=false;
  var show=setTimeout(function(){if(!finished)document.documentElement.classList.add('pb-loading');},180);
  var fallback=setTimeout(finish,3200);
  function finish(){
    if(finished)return;
    finished=true;clearTimeout(show);clearTimeout(fallback);
    document.documentElement.classList.remove('pb-loading');
    window.pbFinishLoading=null;
  }
  window.pbFinishLoading=finish;
  window.addEventListener('pageshow',function(event){if(event.persisted)finish();});
}());
</script>
